name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to build (for example v0.1.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release version
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - name: Check tag, versions, and release notes
        id: metadata
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: node scripts/release-check.mjs
      - name: Resolve immutable source commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - name: macOS Apple Silicon
            platform: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          - name: macOS Intel
            platform: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg
          - name: Linux x64
            platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf libfuse2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: pnpm
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: rustfmt
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target
          key: release-${{ matrix.target }}
      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Test Rust backend
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Build installers with the Tauri CLI
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        with:
          tauriScript: node node_modules/@tauri-apps/cli/tauri.js
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked
      - name: Keep installers for the publishing job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tips-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    name: Publish complete release
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: tips-*
          path: release-assets
          merge-multiple: true
      - name: Verify assets, add checksums, and publish
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
        with:
          script: |
            const fs = require('node:fs/promises');
            const path = require('node:path');
            const crypto = require('node:crypto');
            const { owner, repo } = context.repo;
            const tag = process.env.RELEASE_TAG;
            const version = process.env.RELEASE_VERSION;
            const directory = 'release-assets';
            async function collect(directory) {
              const result = [];
              for (const entry of await fs.readdir(directory, { withFileTypes: true })) {
                const file = path.join(directory, entry.name);
                if (entry.isDirectory()) result.push(...await collect(file));
                else if (entry.isFile()) result.push({ name: entry.name, file });
                else throw new Error(`Unexpected release artifact: ${file}`);
              }
              return result;
            }
            const files = (await collect(directory)).sort((left, right) => left.name.localeCompare(right.name));
            if (new Set(files.map(asset => asset.name)).size !== files.length) {
              throw new Error('Release asset filenames must be unique across platforms');
            }
            const expected = { '.exe': 1, '.dmg': 2, '.deb': 1, '.AppImage': 1 };
            if (files.length !== 5) throw new Error(`Expected 5 installers, received ${files.length}`);
            for (const [extension, count] of Object.entries(expected)) {
              if (files.filter(asset => asset.name.endsWith(extension)).length !== count) {
                throw new Error(`Expected ${count} ${extension} installers`);
              }
            }
            const checksums = [];
            for (const { name, file } of files) {
              if (!name.includes(version)) {
                throw new Error(`Unexpected release asset: ${name}`);
              }
              const hash = crypto.createHash('sha256').update(await fs.readFile(file)).digest('hex');
              checksums.push(`${hash}  ${name}`);
            }
            await fs.writeFile(path.join(directory, 'SHA256SUMS.txt'), checksums.join('\n') + '\n');
            files.push({ name: 'SHA256SUMS.txt', file: path.join(directory, 'SHA256SUMS.txt') });
            const body = await fs.readFile(`docs/releases/${tag}.md`, 'utf8');
            const prerelease = process.env.RELEASE_PRERELEASE === 'true';
            let release = (await github.paginate(github.rest.repos.listReleases, { owner, repo }))
              .find(candidate => candidate.tag_name === tag);
            if (release && !release.draft) {
              throw new Error(`${tag} is already published; use a new version to change release assets`);
            }
            const metadata = {
              owner, repo, tag_name: tag, name: `Tips ${tag}`,
              target_commitish: process.env.RELEASE_COMMIT, body, prerelease, draft: true,
            };
            release = release
              ? (await github.rest.repos.updateRelease({ ...metadata, release_id: release.id })).data
              : (await github.rest.repos.createRelease(metadata)).data;
            const existing = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner, repo, release_id: release.id,
            });
            for (const { name, file } of files) {
              const previous = existing.find(asset => asset.name === name);
              if (previous) await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: previous.id });
              await github.rest.repos.uploadReleaseAsset({
                owner, repo, release_id: release.id, name,
                data: await fs.readFile(file),
              });
            }
            const published = await github.rest.repos.updateRelease({
              owner, repo, release_id: release.id, draft: false,
              make_latest: prerelease ? 'false' : 'true',
            });
            core.notice(`Published ${published.data.html_url}`);
            await core.summary.addLink(`Download Tips ${tag}`, published.data.html_url).write();
